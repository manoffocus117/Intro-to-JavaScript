<!doctype html>
<html lang="en">
      <head>
            <meta charset="UTF-8" />
            <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0"
            />
            <title>try catch</title>
            <style>
                  * {
                        margin: 0;
                        padding: 0;
                        box-sizing: border-box;
                  }

                  html,
                  body {
                        height: 100%;
                        width: 100%;
                        overflow-x: hidden;
                  }

                  input,
                  textarea,
                  button:focus {
                        outline: none;
                  }

                  input::-webkit-outer-spin-button,
                  input::-webkit-inner-spin-button {
                        -webkit-appearance: none;
                        margin: 0;
                  }

                  input[type="number"] {
                        -moz-appearance: textfield;
                        appearance: textfield;
                  }

                  ul li {
                        list-style: none;
                  }

                  a {
                        text-decoration: none;
                  }

                  section {
                        margin: 100px;
                  }

                  #error {
                        color: red;
                  }
            </style>
      </head>
      <body>
            <section>
                  <input
                        id="age"
                        type="number"
                        placeholder="enter your age between 18-30"
                  />
                  <button onclick="submit_age()">submit</button>

                  <p id="error"></p>
            </section>

            <script src="try-catch.js"></script>
      </body>
</html>
